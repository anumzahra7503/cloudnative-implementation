apiVersion: v1
kind: Secret
metadata:
  name: todo-db
  namespace: todo
  labels:
    app.kubernetes.io/part-of: todo-app
type: Opaque
stringData:
  MONGODB_ROOT_PASSWORD: adminpass
  MONGODB_USERNAME: appuser
  MONGODB_PASSWORD: apppass
  MONGODB_DATABASE: test
  DB_NAME: test
  DB_CONNECTION: mongodb://appuser:apppass@mongodb:27017/test
---
apiVersion: v1
kind: Secret
metadata:
  name: todo-frontend-env
  namespace: todo
  labels:
    app.kubernetes.io/part-of: todo-app
type: Opaque
stringData:
  # Browser-reachable API URL. Terraform overwrites this with the Minikube IP.
  REACT_APP_API_ENDPOINT: http://127.0.0.1:30080
